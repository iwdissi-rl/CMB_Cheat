[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmb"
version = "0.3.0"
description = "CLI for The Chairman's Bao: borrow your browser login (Firefox, Chrome, Chromium, Brave, Edge), paste passage links, auto-complete the reading quizzes with a random reading time between each."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "iwdissi-rl" }]

[project.scripts]
cmb = "cmb.cli:main"

[tool.setuptools]
packages = ["cmb"]
